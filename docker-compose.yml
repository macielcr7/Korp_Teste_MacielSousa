name: korp-invoice-system

services:
  inventory-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - inventory-data:/var/lib/postgresql
    networks:
      - inventory-db

  billing-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BILLING_DB_NAME:-billing}
      POSTGRES_USER: ${BILLING_DB_USER:-billing}
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD:-billing}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - billing-data:/var/lib/postgresql
    networks:
      - billing-db

  inventory-migrate:
    build:
      context: ./services/inventory
    command: ["/app/bin/migrate", "-migrations", "/app/migrations"]
    environment:
      DATABASE_URL: postgres://${INVENTORY_DB_USER:-inventory}:${INVENTORY_DB_PASSWORD:-inventory}@inventory-db:5432/${INVENTORY_DB_NAME:-inventory}?sslmode=disable
    depends_on:
      inventory-db:
        condition: service_healthy
    restart: "no"
    networks:
      - inventory-db

  billing-migrate:
    build:
      context: ./services/billing
    command: ["/app/bin/migrate", "-migrations", "/app/migrations"]
    environment:
      DATABASE_URL: postgres://${BILLING_DB_USER:-billing}:${BILLING_DB_PASSWORD:-billing}@billing-db:5432/${BILLING_DB_NAME:-billing}?sslmode=disable
    depends_on:
      billing-db:
        condition: service_healthy
    restart: "no"
    networks:
      - billing-db

  inventory:
    build:
      context: ./services/inventory
    environment:
      HTTP_ADDR: :8081
      INTERNAL_HTTP_ADDR: :8083
      INVENTORY_INTERNAL_TOKEN: ${INVENTORY_INTERNAL_TOKEN:?configure INVENTORY_INTERNAL_TOKEN in .env}
      DATABASE_URL: postgres://${INVENTORY_DB_USER:-inventory}:${INVENTORY_DB_PASSWORD:-inventory}@inventory-db:5432/${INVENTORY_DB_NAME:-inventory}?sslmode=disable
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "${INVENTORY_HTTP_PORT:-8081}:8081"
    restart: unless-stopped
    networks:
      - edge
      - inventory-internal
      - inventory-db

  billing-api:
    build:
      context: ./services/billing
    environment:
      HTTP_ADDR: :8082
      DATABASE_URL: postgres://${BILLING_DB_USER:-billing}:${BILLING_DB_PASSWORD:-billing}@billing-db:5432/${BILLING_DB_NAME:-billing}?sslmode=disable
      INVENTORY_BASE_URL: http://inventory:8083
      INVENTORY_INTERNAL_TOKEN: ${INVENTORY_INTERNAL_TOKEN:?configure INVENTORY_INTERNAL_TOKEN in .env}
      INVENTORY_HTTP_TIMEOUT: ${INVENTORY_HTTP_TIMEOUT:-5s}
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "${BILLING_HTTP_PORT:-8082}:8082"
    restart: unless-stopped
    networks:
      - edge
      - inventory-internal
      - billing-db

  billing-worker:
    build:
      context: ./services/billing
    command: ["/app/bin/worker"]
    environment:
      DATABASE_URL: postgres://${BILLING_DB_USER:-billing}:${BILLING_DB_PASSWORD:-billing}@billing-db:5432/${BILLING_DB_NAME:-billing}?sslmode=disable
      INVENTORY_BASE_URL: http://inventory:8083
      INVENTORY_INTERNAL_TOKEN: ${INVENTORY_INTERNAL_TOKEN:?configure INVENTORY_INTERNAL_TOKEN in .env}
      INVENTORY_HTTP_TIMEOUT: ${INVENTORY_HTTP_TIMEOUT:-5s}
      WORKER_POLL_INTERVAL: 1s
      WORKER_LEASE_DURATION: ${WORKER_LEASE_DURATION:-30s}
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      inventory:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - inventory-internal
      - billing-db

  web:
    build:
      context: ./apps/web
    depends_on:
      billing-api:
        condition: service_healthy
      inventory:
        condition: service_healthy
    ports:
      - "${WEB_HTTP_PORT:-4200}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null && wget -q -O - http://inventory:8081/ready >/dev/null && wget -q -O - http://billing-api:8082/ready >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - edge

volumes:
  inventory-data:
  billing-data:

networks:
  edge:
    driver: bridge
  inventory-internal:
    internal: true
    driver: bridge
  inventory-db:
    internal: true
    driver: bridge
  billing-db:
    internal: true
    driver: bridge
